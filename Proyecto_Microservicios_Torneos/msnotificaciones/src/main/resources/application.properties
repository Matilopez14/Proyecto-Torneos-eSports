spring.application.name=msnotificaciones
server.port=8090

# Base de datos propia para las alertas
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/bd_msnotificaciones?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

